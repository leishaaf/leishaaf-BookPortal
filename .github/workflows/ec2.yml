name: AWS-EC2 Instance CD

on:
  workflow_run:
    workflows: ["Node.js CI"]
    types: [completed]

jobs:
  on-success:

    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # AWS Academy lab credentials are temporary, so they need the session token too
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # !!! workingDirectory may vary depending on where your docker-compose file is located.
      - name: AWS SSM Send-Command
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "docker-compose.yml file re-pulls newer versions of book-portal images and runs them on the instance." \
            --parameters 'workingDirectory=["/home/ubuntu"],commands=["sudo docker compose stop","sudo docker compose rm -f","sudo docker compose pull","sudo docker compose up -d","sudo docker image prune -af"]'